name: Bug report
description: Something in Copyrail does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste real client drafts, passwords or session cookies.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A short draft and guideline set that triggers it is ideal
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: copyrail.vercel.app or a local setup, with commit hash if local
  - type: input
    id: browser
    attributes:
      label: Browser and device
