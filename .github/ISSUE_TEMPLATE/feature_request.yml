name: Feature request
description: Something Copyrail should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describe your review workflow, not the solution
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you expect Copyrail to do?
